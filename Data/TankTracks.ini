; For guide on how to configure these see the framework's workshop page: https://steamcommunity.com/sharedfiles/filedetails/?id=3208995513


; The small vs large differentiation is to not allow connecting between grid sizes. One can instead make a single design for both sizes to allow that.

[Design:VanillaOTT_Small]
DisplayName = Over-the-tire
Icon = VanillaOTT_Icon

[Design:VanillaOTT_Large]
DisplayName = Over-the-tire
Icon = VanillaOTT_Icon


; I'm designating a single track per block for tweaking, but it's not required.
; You can have a single track definition applied to many blocks if you wish.

[Track:VanillaOTT_Small_1x1]
Design = VanillaOTT_Small
SegmentModel = Models\Segment.mwm
SegmentConstruction = Models\Segment_Construction.mwm
SegmentScale = 0.45, 0.45, 0.45
SegmentOffset = 0.1, -0.025, 0

[Track:VanillaOTT_Small_1x1_Static]
Inherit = VanillaOTT_Small_1x1
SegmentOffset = 0, -0.05, 0
AllowOnRotors = true

[Track:VanillaOTT_Small_2x2]
Inherit = VanillaOTT_Small_1x1
SegmentScale = 0.45, 0.45, 0.45
SegmentOffset = 0.1, -0.025, 0

[Track:VanillaOTT_Small_2x2_Static]
Inherit = VanillaOTT_Small_2x2
SegmentOffset = 0, -0.05, 0
AllowOnRotors = true

[Track:VanillaOTT_Small_3x3]
Inherit = VanillaOTT_Small_1x1
SegmentScale = 0.75, 0.75, 0.75
SegmentOffset = 0.175, -0.05, 0

[Track:VanillaOTT_Small_3x3_Static]
Inherit = VanillaOTT_Small_3x3
SegmentScale = 0.5, 0.5, 0.5
SegmentOffset = 0, -0.01, 0
AllowOnRotors = true

[Track:VanillaOTT_Small_5x5]
Inherit = VanillaOTT_Small_1x1
SegmentScale = 1.5, 1.5, 1.5
SegmentOffset = 0.15, -0.1, 0

[Track:VanillaOTT_Small_5x5_Static]
Inherit = VanillaOTT_Small_5x5
SegmentScale = 1.2, 1.2, 1.2
SegmentOffset = 0, 0, 0
AllowOnRotors = true



[Track:VanillaOTT_Large_1x1]
Inherit = VanillaOTT_Small_1x1
Design = VanillaOTT_Large
SegmentScale = 2.3, 2.3, 2.3
SegmentOffset = 0.5, -0.15, 0

[Track:VanillaOTT_Large_1x1_Static]
Inherit = VanillaOTT_Large_1x1
SegmentScale = 2.5, 2.5, 2.5
SegmentOffset = 0, -0.15, 0
AllowOnRotors = true

[Track:VanillaOTT_Large_2x2]
Inherit = VanillaOTT_Large_1x1
SegmentScale = 2.3, 2.3, 2.3
SegmentOffset = 0.5, -0.15, 0

[Track:VanillaOTT_Large_2x2_Static]
Inherit = VanillaOTT_Large_2x2
SegmentScale = 2.5, 2.5, 2.5
SegmentOffset = 0, -0.15, 0
AllowOnRotors = true

[Track:VanillaOTT_Large_3x3]
Inherit = VanillaOTT_Large_1x1
SegmentScale = 3.5, 3.5, 3.5
SegmentOffset = 0.7, -0.25, 0

[Track:VanillaOTT_Large_3x3_Static]
Inherit = VanillaOTT_Large_3x3
SegmentScale = 2.8, 2.8, 2.8
SegmentOffset = 0, -0.25, 0
AllowOnRotors = true

[Track:VanillaOTT_Large_5x5]
Inherit = VanillaOTT_Large_3x3
SegmentScale = 7.5, 7.5, 7.5
SegmentOffset = 0.75, -0.6, 0

[Track:VanillaOTT_Large_5x5_Static]
Inherit = VanillaOTT_Large_5x5
SegmentScale = 5.5, 5.5, 5.5
SegmentOffset = 0, -0.15, 0
AllowOnRotors = true




