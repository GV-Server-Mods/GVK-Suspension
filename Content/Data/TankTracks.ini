SegmentOffset 		= 0.09, -0.335, 0

;Kharak Tread (GVK)
[Design:KharakTread_Large]
DisplayName 		= Kharak Tread
Icon 			= KharakTread_Icon

; One link for every size, modelled at 3x3 size: 2.80 m wide, 0.78 m pitch. Its origin is on the plate's
; underside, so Y 0 rests the plate on the tire. X puts the guide horn in the track wheel groove.
; Y lowers the tread so its outer face ends at the tire's collision sphere (tread above the ground); the
; GVK track wheels are drawn smaller by the same amount, and every wheel reports its vanilla tire's
; radius (WheelOverride below). Y = sphere - link thickness - sqrt(radius^2 + (pitch/2)^2).
; Every large 1x1 reports 0.17 m more (1.448), and its styles drop to match, so a 1x1 sinks less under a
; bigger wheel's track (0.04-0.08 m under a 3x3, was 0.21). Under a 5x5 it still clips.
[Track:KharakTread_Large_1x1_Track]
Design 			= KharakTread_Large
SegmentModel 		= Models\KharakTread.mwm
SegmentConstruction 	= Models\KharakTread_Construction.mwm
; X 1.104: 3.09 m, so the tread hangs about 4 cm past each face of the wheel (rim to rim 3.01 m; rubber 2.80 m)
SegmentScale 		= 1.104, 1, 1
SegmentOffset 		= .554, -0.615, 0

[Track:KharakTread_Large_2x2_Track]
Inherit 		= KharakTread_Large_1x1_Track
SegmentOffset 		= 1.326, -0.519, 0

[Track:KharakTread_Large_3x3_Track]
Inherit 		= KharakTread_Large_1x1_Track
SegmentOffset 		= .757, -0.664, 0

[Track:KharakTread_Large_5x5_Track]
Inherit 		= KharakTread_Large_1x1_Track
; 5x5 wheel is 6.41 m rim to rim (rubber 5.96 m): 2.13 x the 3x3 link, kept in proportion; X 2.318 (6.49 m) hangs about
; 4 cm past each face
SegmentScale 		= 2.318, 2.13, 2.13
SegmentOffset 		= .529, -1.049, 0

; Track Wheel blocks: their OutOffset puts the groove on the line, so no X here.
[Track:KharakTread_Large_1x1_Static]
Inherit 		= KharakTread_Large_1x1_Track
SegmentOffset 		= 0, -0.615, 0
AllowOnRotors 		= true

[Track:KharakTread_Large_3x3_Static]
Inherit 		= KharakTread_Large_3x3_Track
SegmentOffset 		= 0, -0.664, 0
AllowOnRotors 		= true

; Wheel swap: a vanilla tire shows the GVK track wheel of its size while it is under a track.
; The track wheels match the vanilla tires (radius, collision, attach point), so a swap style is its tank style
; plus the swap model. Construction model: the bare steel wheel (BS2).
[Track:KharakTread_Large_1x1_Swap]
Inherit 		= KharakTread_Large_1x1_Track
ReplaceWheelModel 	= Models\TankWheel1x1.mwm
ReplaceWheelModelConstruction = Models\TankWheel1x1_BS2.mwm

[Track:KharakTread_Large_2x2_Swap]
Inherit 		= KharakTread_Large_2x2_Track
ReplaceWheelModel 	= Models\TankWheel2x2.mwm
ReplaceWheelModelConstruction = Models\TankWheel2x2_BS2.mwm

[Track:KharakTread_Large_3x3_Swap]
Inherit 		= KharakTread_Large_3x3_Track
ReplaceWheelModel 	= Models\TankWheel3x3.mwm
ReplaceWheelModelConstruction = Models\TankWheel3x3_BS2.mwm

[Track:KharakTread_Large_5x5_Swap]
Inherit 		= KharakTread_Large_5x5_Track
ReplaceWheelModel 	= Models\TankWheel5x5.mwm
ReplaceWheelModelConstruction = Models\TankWheel5x5_BS2.mwm

; Offroad tires are a little bigger than vanilla ones but have the same collision sphere, so their Y comes
; from the offroad radius. The offroad 1x1 reports the vanilla 1x1's radius, so it shares the 1x1 Y.
[Track:KharakTread_Large_1x1_Swap_Offroad]
Inherit 		= KharakTread_Large_1x1_Swap
SegmentOffset 		= .554, -0.615, 0

[Track:KharakTread_Large_2x2_Swap_Offroad]
Inherit 		= KharakTread_Large_2x2_Swap
SegmentOffset 		= 1.326, -0.541, 0

[Track:KharakTread_Large_3x3_Swap_Offroad]
Inherit 		= KharakTread_Large_3x3_Swap
SegmentOffset 		= .757, -0.697, 0

[Track:KharakTread_Large_5x5_Swap_Offroad]
Inherit 		= KharakTread_Large_5x5_Swap
SegmentOffset 		= .529, -1.091, 0


; Digi's over-the-tire track on the GVK track wheels, lowered by the same amount as the wheel shrinks.
[Track:LiftedOTT_Large_1x1_Offroad_TrackWheel]
Inherit 		= LiftedOTT_Large_1x1_Offroad
SegmentOffset 		= 0.09, -0.611, 0

[Track:LiftedOTT_Large_2x2_Offroad_TrackWheel]
Inherit 		= LiftedOTT_Large_2x2_Offroad
