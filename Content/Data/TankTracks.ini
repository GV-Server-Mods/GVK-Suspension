;Kharak Double Tread (GVK): two road wheels side by side under a two-band tread, 4.86 m across (9.86 m on 5x5)
[Design:KharakDoubleTread_Large]
DisplayName 		= Kharak Double Tread
Icon 			= KharakDoubleTread_Icon

; Visual only: every style swaps the wheel model, and the wheel keeps its tire's collision, grip and radius.
; The double meshes sit a little nearer the hull than the single groove line so they span whole cells, so X
; is the single style's X less that shift.
[Track:KharakDoubleTread_Large_1x1_Swap]
Design 			= KharakDoubleTread_Large
SegmentModel 		= Models\KharakDoubleTread.mwm
SegmentConstruction 	= Models\KharakDoubleTread_Construction.mwm
; X 0.979: the 4.96 m link cut to 4.856 m, just inside both rim faces (every double is 4.86 m rim to rim)
SegmentScale 		= 0.979, 1, 1
SegmentOffset 		= .417, -0.615, 0
ReplaceWheelModel 	= Models\TankWheelDouble1x1.mwm
ReplaceWheelModelConstruction = Models\TankWheelDouble1x1_BS1.mwm

[Track:KharakDoubleTread_Large_2x2_Swap]
Inherit 		= KharakDoubleTread_Large_1x1_Swap
SegmentOffset 		= 1.188, -0.519, 0
ReplaceWheelModel 	= Models\TankWheelDouble2x2.mwm
ReplaceWheelModelConstruction = Models\TankWheelDouble2x2_BS1.mwm

[Track:KharakDoubleTread_Large_3x3_Swap]
Inherit 		= KharakDoubleTread_Large_1x1_Swap
SegmentOffset 		= .613, -0.664, 0
ReplaceWheelModel 	= Models\TankWheelDouble3x3.mwm
ReplaceWheelModelConstruction = Models\TankWheelDouble3x3_BS1.mwm

[Track:KharakDoubleTread_Large_5x5_Swap]
Inherit 		= KharakDoubleTread_Large_1x1_Swap
; 10 m double: 2.13 along and in thickness as the single 5x5; X 1.987 (9.856 m) just inside both rim faces (9.86 m)
SegmentScale 		= 1.987, 2.13, 2.13
SegmentOffset 		= .401, -1.049, 0
ReplaceWheelModel 	= Models\TankWheelDouble5x5.mwm
ReplaceWheelModelConstruction = Models\TankWheelDouble5x5_BS1.mwm

; Offroad tires: the same tread drop as the single _Swap_Offroad styles.
[Track:KharakDoubleTread_Large_1x1_Swap_Offroad]
Inherit 		= KharakDoubleTread_Large_1x1_Swap
SegmentOffset 		= .417, -0.615, 0

[Track:KharakDoubleTread_Large_2x2_Swap_Offroad]
Inherit 		= KharakDoubleTread_Large_2x2_Swap
SegmentOffset 		= 1.188, -0.541, 0

[Track:KharakDoubleTread_Large_3x3_Swap_Offroad]
Inherit 		= KharakDoubleTread_Large_3x3_Swap
SegmentOffset 		= .613, -0.697, 0

[Track:KharakDoubleTread_Large_5x5_Swap_Offroad]
Inherit 		= KharakDoubleTread_Large_5x5_Swap
SegmentOffset 		= .401, -1.091, 0

; Track Wheel blocks: the block itself swaps to its double model (a static roller's wheel is the block).
[Track:KharakDoubleTread_Large_1x1_Static]
Inherit 		= KharakDoubleTread_Large_1x1_Swap
