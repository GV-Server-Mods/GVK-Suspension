[Track:GVK_RubberTrack_Large_5x5_Track]
Inherit 		= GVK_RubberTrack_Large_1x1_Track
; Its own link, modeled at full size so the rubber texture reads the same size as on the 3x3: 8.52 m wide
; (1.28 m past each side of the 5.96 m rubber), 0.42 m thick: a 1.10 m lug with finer staggered pockets,
; pivots 1.25 m apart.
; 0.42 m is less than the 0.512 m between the drawn wheel and the collision sphere, so the link sits halfway:
; 4.6 cm off the wheel and 4.6 cm into the ground. Y = 5.334 - sqrt(radius^2 + 0.625^2).
SegmentModel 		= Models\RubberTrack5x5.mwm
SegmentConstruction 	= Models\RubberTrack5x5_Construction.mwm
SegmentScale 		= 1, 1, 1
SegmentOffset 		= .529, -0.179, 0

