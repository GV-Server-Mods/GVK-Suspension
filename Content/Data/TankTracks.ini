[WheelOverride:Wheel/RealTrackWheel1x1]
; Model is 4.34 m across the axle; 4.55 keeps it the biggest wheel when mixed with a vanilla 2x2,
; which a track can't fit inside (Digi's alignment check): Width + Radius 5.447 against 5.191 (offroad 5.342).
; Width only affects that check.
Width = 4.55
Radius = 0.897

; Every track wheel and tire reports the radius the Kharak Tread's hinges are drawn at, whatever model it shows
; (0.897 / 2.121 / 3.255 / 5.478; offroad tires bigger by as much as their drawn tire), so the links don't
; bunch on curves. A swapped tire keeps its swap model when a track is destroyed (Tank Tracks measures the
; model when a track is built), so the overrides also keep a rebuilt track the same. Digi's over-the-tire
; styles on these tires are moved out to match (Merge above). A later mod replaces Digi's whole entry, so his
; Width is restated. Keen's static Wheel blocks keep their own size.

