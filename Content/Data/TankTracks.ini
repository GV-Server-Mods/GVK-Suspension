;Rubber Track (GVK): rubber lugs, 4.0 m wide, 0.90 m pitch (5x5: 8.52 m, 1.25 m)
[Design:GVK_RubberTrack_Large]
DisplayName 		= Rubber Track
Icon 			= RubberTrack_Icon

; One link for 1x1 to 3x3, modeled at 3x3 size (0.30 m thick) and centered on the groove (X as the Kharak
; Tread), its origin on the inner face, pivots 0.90 m apart. SegmentScale Y thins it per size (owner pick "A"):
; 0.15 m on 1x1, 0.195 m on 2x2, 0.24 m on 3x3. Each sits halfway between the drawn wheel and the collision
; sphere on the ground run: inner face r0 = (sphere - thickness + drawn radius) / 2,
; Y = r0 - sqrt(radius^2 + (pitch/2)^2). On the 3x3, 0.24 m is more than the 0.235 m space, so the link sits
; on the ground line (r0 = sphere - 0.24). The radii are set for the Kharak Tread, so on curves these links
; still overlap a little on curves (3.8% on 1x1, about 1.5% or less on the rest).
[Track:GVK_RubberTrack_Large_1x1_Track]
Design 			= GVK_RubberTrack_Large
SegmentModel 		= Models\RubberTrack.mwm
SegmentConstruction 	= Models\RubberTrack_Construction.mwm
SegmentScale 		= 1, 0.50, 1
SegmentOffset 		= .554, -0.113, 0

[Track:GVK_RubberTrack_Large_2x2_Track]
